name: SDK bump

# Weekly: if matrix-rust-components-swift has a newer release than project.yml pins,
# open (or update) a pull request that moves the pin. The Build workflow runs on the
# pull request: green means an agent reviews and merges; red means the SDK changed
# an API we use, and the pull request shows where.

on:
  schedule:
    - cron: "7 5 * * 1"   # Mondays 05:07 UTC, after the build
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Find the newest SDK release
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/element-hq/matrix-rust-components-swift/releases/latest --jq .tag_name)"
          current="$(sed -n 's/^ *exactVersion: *//p' project.yml | head -1)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "pinned $current, newest $latest"

      - name: Open the pull request
        if: steps.sdk.outputs.latest != steps.sdk.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.sdk.outputs.latest }}
          CURRENT: ${{ steps.sdk.outputs.current }}
        run: |
          branch="sdk-bump"
          sed -i "s/exactVersion: $CURRENT/exactVersion: $LATEST/" project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -am "Matrix SDK $CURRENT -> $LATEST"
          git push --force origin "$branch"
          body="Moves the pinned Matrix SDK from $CURRENT to $LATEST.
          Changes: https://github.com/matrix-org/matrix-rust-sdk/releases (bindings: https://github.com/element-hq/matrix-rust-components-swift/releases/tag/$LATEST)."
          # Build the branch first; a pull request opened with the workflow token starts no workflow.
          gh workflow run build.yml --ref "$branch"
          # The organisation does not let Actions open pull requests today. Then the green
          # branch build is the signal, and an agent opens the pull request.
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "Matrix SDK $LATEST" --body "$body" || true
          else
            gh pr create --head "$branch" --base main --title "Matrix SDK $LATEST" --body "$body" \
              || echo "::notice::No pull request (organisation policy). Branch $branch is pushed and building."
          fi
