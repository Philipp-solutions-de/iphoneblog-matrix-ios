name: Build

# Every push and pull request: build, unit tests, and the sign-in test against a
# throwaway Synapse on the runner. Weekly as well, so a broken runner image shows up
# before a release needs it; a red scheduled run opens an issue.
# TestFlight runs only when the repository variable TESTFLIGHT_ENABLED is "true".

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Xcode both runners must have: GitHub's image takes its newest Xcode 27.x, the Mac
  # Studio its /Applications/Xcode.app, which must be a 27.x (docs/mac-runner.md, "Xcode").
  XCODE_MAJOR: "27"

jobs:
  pick:
    name: Pick a runner
    # The Mac Studio when it is online and idle and the code is ours; GitHub's hosted Xcode 27
    # image otherwise (docs/mac-runner.md, "Which runner").
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
      where: ${{ steps.pick.outputs.where }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/mac-runner
      - name: Test the choice
        run: scripts/mac-runner/test-pick-runner.sh
      - name: Pick
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          MAC_RUNNER: ${{ vars.MAC_RUNNER }}
          STATUS_TOKEN: ${{ secrets.MAC_RUNNER_STATUS_TOKEN }}
        run: |
          scripts/mac-runner/pick-runner.sh >> "$GITHUB_OUTPUT" 2> reason.txt || { cat reason.txt; exit 1; }
          cat reason.txt
          echo "Runner: $(tail -1 reason.txt)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and test
    needs: pick
    runs-on: ${{ fromJSON(needs.pick.outputs.runs-on) }}
    # Build, unit, sign-in and 20 UI tests on a hosted runner: 70 minutes in the morning, past
    # two hours on a busy evening (2026-11-19: two builds cut off at 120 with no test failed).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode
        if: runner.environment == 'github-hosted'
        run: |
          xcode="$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$xcode" ] || { ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # The runner's user has no sudo; its .env sets DEVELOPER_DIR to /Applications/Xcode.app.
      - name: Check Xcode and the iOS runtime (Mac Studio)
        if: runner.environment == 'self-hosted'
        run: |
          xcodebuild -version
          version="$(xcodebuild -version | sed -n 's/^Xcode //p')"
          [ "${version%%.*}" = "$XCODE_MAJOR" ] ||
            { echo "::error::The Mac Studio has Xcode $version, the workflow wants $XCODE_MAJOR.x"; exit 1; }
          sdk="$(xcodebuild -showsdks | sed -nE 's/.*-sdk iphonesimulator([0-9.]+).*/\1/p' | tail -1)"
          xcrun simctl list runtimes | grep "^iOS $sdk " ||
            { echo "::error::No iOS $sdk simulator runtime on the Mac Studio (docs/mac-runner.md, Xcode)"; exit 1; }
          # Ports of its own: Thorsten's local test runs on this Mac hold 8008 and 8793.
          echo "TEST_HOMESERVER_PORT=18008" >> "$GITHUB_ENV"
          echo "FIXTURE_PORT=18793" >> "$GITHUB_ENV"
          # A cancelled run can leave its servers behind; end ci's own by PID.
          for port in 18008 18793; do
            pids="$(lsof -a -ti "tcp:$port" -sTCP:LISTEN -u ci || true)"
            [ -z "$pids" ] || { echo "ending leftover server on $port: $pids"; kill $pids; }
          done

      - name: Install tools
        run: scripts/install-xcodegen.sh build/tools >> "$GITHUB_PATH"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Vendor/ElementX matches its Element X release plus our patches
        run: scripts/sync-elementx.sh --check

      - name: Generate the project
        run: scripts/configure.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/SourcePackages
          # One cache per kind of runner: Swift packages record absolute paths, and the
          # workspace is /Users/runner/work on GitHub but /Users/ci/actions-runner/_work here.
          key: spm-${{ runner.environment }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.environment }}-

      - name: Build
        run: scripts/build.sh build

      - name: Unit tests
        run: scripts/build.sh test

      - name: Start a test homeserver
        run: scripts/test-homeserver.sh start

      - name: Sign-in test
        run: |
          set -a; . build/test-homeserver.env; set +a
          scripts/build.sh integration

      - name: UI tests (blog, discussion, swipe back, rich messages, uploads)
        run: |
          set -a; . build/test-homeserver.env; set +a
          scripts/build.sh ui

      - name: Stop the test homeserver
        if: always()
        run: scripts/test-homeserver.sh stop

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs
          path: |
            build/*.log
            build/synapse/homeserver.log
          if-no-files-found: ignore

  testflight:
    name: TestFlight
    needs: build
    # The Apple key lives in the environment `apple`, which only main may use. This job runs
    # only for a push to main or a hand run on main: reviewed code, never a pull request,
    # fork or other branch. It stays on GitHub's runner: no Apple secret on the Mac Studio.
    if: >-
      vars.TESTFLIGHT_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: apple
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - name: Install tools (pinned)
        run: |
          scripts/install-xcodegen.sh build/tools >> "$GITHUB_PATH"
          bundle install
      - name: Vendor/ElementX matches its Element X release plus our patches
        run: scripts/sync-elementx.sh --check

      - name: Generate the project
        run: scripts/configure.sh
      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta

  report:
    name: Report a red scheduled build
    needs: [pick, build, testflight]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create build-failure --color B60205 --description "Scheduled build is red" 2>/dev/null || true
          open="$(gh issue list --label build-failure --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still red: $RUN_URL"
          else
            gh issue create --title "Scheduled build failed" --label build-failure --body "$RUN_URL"
          fi
