name: Build

# Every push and pull request: build, unit tests, and the sign-in test against a
# throwaway Synapse on the runner. Weekly as well, so a broken runner image shows up
# before a release needs it; a red scheduled run opens an issue.
# TestFlight runs only when the repository variable TESTFLIGHT_ENABLED is "true".

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # GitHub's hosted Xcode 27 image (public preview); macos-26 has no Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$xcode" ] || { ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen uv

      - name: Generate the project
        run: scripts/configure.sh

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
          restore-keys: spm-

      - name: Build
        run: scripts/build.sh build

      - name: Unit tests
        run: scripts/build.sh test

      - name: Start a test homeserver
        run: scripts/test-homeserver.sh start

      - name: Sign-in test
        run: |
          set -a; . build/test-homeserver.env; set +a
          scripts/build.sh integration

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: |
            build/*.log
            build/synapse/homeserver.log
          if-no-files-found: ignore

  testflight:
    name: TestFlight
    needs: build
    if: vars.TESTFLIGHT_ENABLED == 'true' && github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - name: Install tools
        run: |
          brew install xcodegen
          bundle install
      - name: Generate the project
        run: scripts/configure.sh
      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta

  report:
    name: Report a red scheduled build
    needs: [build, testflight]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create build-failure --color B60205 --description "Scheduled build is red" 2>/dev/null || true
          open="$(gh issue list --label build-failure --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still red: $RUN_URL"
          else
            gh issue create --title "Scheduled build failed" --label build-failure --body "$RUN_URL"
          fi
