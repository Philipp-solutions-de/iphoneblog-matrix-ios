name: Build

# Every push and pull request: one build, then the unit, sign-in and UI tests in four shards
# side by side, each against its own throwaway Synapse (docs/mac-runner.md, "Test shards").
# Weekly as well, so a broken runner image shows up before a release needs it; a red scheduled
# run opens an issue. On main, TestFlight uploads right after the build, without waiting for the
# tests, unless the last main build's tests were red (docs/mac-runner.md, "TestFlight").
# TestFlight runs only when the repository variable TESTFLIGHT_ENABLED is "true".

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A new push to a branch cancels its older run; on main a merge waits instead, or merges
  # an hour apart cancelled every 2.5-hour main build and nothing reached TestFlight
  # (2026-11-20/21, architecture.md "Build and CI").
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Xcode both runners must have: GitHub's image takes its newest Xcode 27.x, the Mac
  # Studio its /Applications/Xcode.app, which must be a 27.x (docs/mac-runner.md, "Xcode").
  XCODE_MAJOR: "27"
  # Read by scripts/low-priority.sh outside CI only; the runner Macs take their priority from
  # MAC_PRIORITY in the runner's .env (docs/mac-runner.md, "Priority"), GitHub's runners none.
  IPHONEBLOG_PRIORITY: ${{ vars.MAC_RUNNER_PRIORITY == 'normal' && 'normal' || 'low' }}

jobs:
  pick:
    name: Pick a runner
    # The MacBook Pro when online and the code is ours; the Mac Studio only after the MBP has
    # been offline for MAC_FALLBACK_MINUTES; GitHub's hosted Xcode 27 image otherwise
    # (docs/mac-runner.md, "Which runner"). On GitHub's Ubuntu runner: the repository is public,
    # so its minutes are free, and iron serves private repositories only.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
      where: ${{ steps.pick.outputs.where }}
      machine: ${{ steps.pick.outputs.machine }}
      last-main-tests: ${{ steps.last.outputs.tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Test the choice
        run: scripts/mac-runner/test-pick-runner.sh
      - name: Pick
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          MAC_RUNNER: ${{ vars.MAC_RUNNER }}
          STATUS_TOKEN: ${{ secrets.MAC_RUNNER_STATUS_TOKEN }}
          FALLBACK_MINUTES: ${{ vars.MAC_FALLBACK_MINUTES || '30' }}
        run: |
          scripts/mac-runner/pick-runner.sh >> "$GITHUB_OUTPUT" 2> reason.txt || { cat reason.txt; exit 1; }
          cat reason.txt
          echo "Runner: $(tail -1 reason.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Were the last main build's tests red?
        id: last
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tests="$(scripts/ci-last-main-tests.sh)"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Last main build's tests: $tests" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: pick
    runs-on: ${{ fromJSON(needs.pick.outputs.runs-on) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Low CPU priority for everything this job starts on the Mac, simulators included: nice 20
      # and the background QoS class on the Mac Studio, nice 20 on every core on the MacBook Pro
      # (its runner .env says MAC_PRIORITY=nice). docs/mac-runner.md, "Priority".
      - name: Low priority (self-hosted Mac)
        if: runner.environment == 'self-hosted'
        run: nohup scripts/mac-runner/lower-priority.sh >/dev/null 2>&1 &

      - name: Xcode
        run: scripts/ci-xcode.sh

      - name: Install tools
        run: scripts/install-xcodegen.sh build/tools >> "$GITHUB_PATH"

      - name: Vendor/ElementX matches its Element X release plus our patches
        run: scripts/sync-elementx.sh --check

      - name: Generate the project
        run: scripts/configure.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData/SourcePackages
          # One cache per workspace folder: Swift packages record absolute paths. GitHub's is
          # /Users/runner/work; on a Mac each runner instance has its own (actions-runner,
          # actions-runner-2 …), and a build failed on packages restored from another folder
          # ("There is no XCFramework found", 2026-11-25). The key names the folder itself: the
          # runner's name did not always match it (runner "mbp" in actions-runner-2).
          key: spm-${{ runner.os }}-${{ github.workspace }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-${{ github.workspace }}-

      - name: Build the app and every test bundle
        # One build at a time on a Mac: two share its Xcode build service and one hangs.
        run: scripts/mac-runner/one-build.sh scripts/build.sh build-for-testing

      - name: The job's processes and their priority (self-hosted Mac)
        if: always() && runner.environment == 'self-hosted'
        run: scripts/mac-runner/lower-priority.sh report

      # The shards test these products without building. On the Mac they stay on its disk; on
      # GitHub every shard is another machine, so they travel as an artifact, in a tar because
      # an artifact drops the executable bits.
      - name: Hand the products to the shards (self-hosted Mac)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$HOME/ci-products"
          find "$HOME/ci-products" -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf {} +
          rm -rf "$HOME/ci-products/$GITHUB_RUN_ID"
          cp -Rp build/DerivedData/Build/Products "$HOME/ci-products/$GITHUB_RUN_ID"
      - name: Pack the products (GitHub)
        if: runner.environment == 'github-hosted'
        run: tar -cf build/products.tar -C build/DerivedData/Build Products
      - name: Hand the products to the shards (GitHub)
        if: runner.environment == 'github-hosted'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: products
          path: build/products.tar
          retention-days: 1
          compression-level: 1

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-build
          path: build/*.log
          if-no-files-found: ignore

  test:
    name: Tests (${{ matrix.shard }}/4)
    needs: [pick, build]
    runs-on: ${{ fromJSON(needs.pick.outputs.runs-on) }}
    # About 25 minutes a shard on the Mac Studio; GitHub's runners are slower and busier.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      TEST_WITHOUT_BUILDING: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Low CPU priority for everything this job starts on the Mac, simulators included: nice 20
      # and the background QoS class on the Mac Studio, nice 20 on every core on the MacBook Pro
      # (its runner .env says MAC_PRIORITY=nice). docs/mac-runner.md, "Priority".
      - name: Low priority (self-hosted Mac)
        if: runner.environment == 'self-hosted'
        run: nohup scripts/mac-runner/lower-priority.sh >/dev/null 2>&1 &

      - name: Xcode
        run: scripts/ci-xcode.sh

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Take the products (self-hosted Mac)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p build/DerivedData/Build
          cp -Rp "$HOME/ci-products/$GITHUB_RUN_ID" build/DerivedData/Build/Products
      - name: Take the products (GitHub)
        if: runner.environment == 'github-hosted'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: products
          path: build
      - name: Unpack the products (GitHub)
        if: runner.environment == 'github-hosted'
        run: |
          mkdir -p build/DerivedData/Build
          tar -xf build/products.tar -C build/DerivedData/Build

      - name: Start a test homeserver
        run: scripts/test-homeserver.sh start

      # Shard 1 carries the unit and sign-in tests; ui-shards.py gives it that much less UI.
      - name: Unit tests
        if: matrix.shard == 1
        run: scripts/build.sh test
      - name: Sign-in test
        if: matrix.shard == 1
        run: |
          set -a; . build/test-homeserver.env; set +a
          scripts/build.sh integration

      - name: Which UI tests this shard runs
        run: |
          scripts/build.sh enumerate-ui
          scripts/ui-shards.py build/ui-tests.json 4 "$SHARD" --preload 360 > build/ui-shard.txt
          cat build/ui-shard.txt

      - name: UI tests
        run: |
          set -a; . build/test-homeserver.env; set +a
          UI_TESTS_FILE=build/ui-shard.txt scripts/build.sh ui

      - name: Stop the test homeserver
        if: always()
        run: scripts/test-homeserver.sh stop

      - name: The job's processes and their priority (self-hosted Mac)
        if: always() && runner.environment == 'self-hosted'
        run: scripts/mac-runner/lower-priority.sh report

      - name: Shut down this shard's simulator (self-hosted Mac)
        if: always() && runner.environment == 'self-hosted'
        run: scripts/mac-runner/shutdown-simulator.sh

      # Every screenshot of each failed test, from the result bundle: the Mac's bundles sit in
      # the walled-off `ci` home, so the artifact is the only way to see them.
      - name: Failure screenshots
        if: failure()
        run: scripts/failure-shots.sh build/ui.xcresult build/shots || echo "no failure screenshots exported"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.shard }}
          path: |
            build/*.log
            build/synapse/homeserver.log
            build/shots
          if-no-files-found: ignore

  # Two TestFlight jobs, one of which runs on main. Normally the upload starts once the build
  # compiles and the tests run beside it; a red test then shows on this run and holds back the
  # next upload. When the last main build's tests were red, the upload waits for this run's own
  # tests instead (docs/mac-runner.md, "TestFlight").
  # The Apple key lives in the environment `apple`, which only main may use: reviewed code,
  # never a pull request, fork or other branch. GitHub's runner only; no Apple secret on the Mac.
  testflight:
    name: TestFlight
    needs: [pick, build]
    if: >-
      vars.TESTFLIGHT_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.pick.outputs.last-main-tests != 'red'
    environment: apple
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      BUNDLE_FROZEN: "true"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/testflight

  testflight-after-tests:
    name: TestFlight (after the tests; the last main build's were red)
    needs: [pick, build, test]
    if: >-
      vars.TESTFLIGHT_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.pick.outputs.last-main-tests == 'red'
    environment: apple
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      BUNDLE_FROZEN: "true"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/testflight

  report:
    name: Report a red scheduled build
    needs: [pick, build, test, testflight, testflight-after-tests]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create build-failure --color B60205 --description "Scheduled build is red" 2>/dev/null || true
          open="$(gh issue list --label build-failure --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still red: $RUN_URL"
          else
            gh issue create --title "Scheduled build failed" --label build-failure --body "$RUN_URL"
          fi
