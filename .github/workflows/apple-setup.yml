name: Apple setup

# Run by hand once the App Store Connect key is in the secrets (docs/apple-setup.md):
# registers the bundle ids and switches on Push Notifications, App Groups and Associated
# Domains. The TestFlight build runs the same lane first, so this is for a first setup only.
# Safe to run again; it only adds what is missing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    # The Apple key lives in the environment `apple`, which only main may use.
    if: github.ref == 'refs/heads/main'
    environment: apple
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install fastlane
        run: bundle install
      - name: Register identifiers and capabilities
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bundle exec fastlane ios register
