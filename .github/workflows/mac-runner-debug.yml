name: Mac runner debug

# Temporary, deleted before PR #53 merges: keeps the Mac Studio busy for eight minutes, so the
# Build run of the same push must fall back to GitHub (MAC_RUNNER_WAIT=1 during the test).

on:
  push:
    branches: [self-hosted-runner]
    paths: [.github/workflows/mac-runner-debug.yml]

permissions:
  contents: read

jobs:
  busy:
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 15
    steps:
      - run: sleep 480
