name: Mac runner debug

# Temporary, deleted before PR #53 merges: one UI test class on the Mac Studio, with the
# result bundle, to find why the UI tests fail there and pass on GitHub.

on:
  push:
    branches: [self-hosted-runner]
    paths: [.github/workflows/mac-runner-debug.yml]

permissions:
  contents: read

jobs:
  debug:
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 60
    env:
      TEST_HOMESERVER_PORT: "18008"
      FIXTURE_PORT: "18793"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Context
        run: |
          id; echo "session: $(launchctl managername 2>&1)"; launchctl print gui/$(id -u) >/dev/null 2>&1 && echo "gui domain: yes" || echo "gui domain: no"
          xcrun simctl list devices available | sed -n '/-- iOS 27.2 --/,/^--/p'
          pgrep -lf Simulator.app || echo "Simulator.app not running"
          sysctl -n vm.loadavg
      - run: scripts/install-xcodegen.sh build/tools >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: scripts/configure.sh
      - run: scripts/build.sh build
      - run: scripts/test-homeserver.sh start
      - name: TabsUITests
        run: |
          set -a; . build/test-homeserver.env; set +a
          UI_ONLY=TabsUITests scripts/build.sh ui || true
          mkdir -p build/attachments
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/attachments || true
          ls build/attachments | head -40
      - if: always()
        run: scripts/test-homeserver.sh stop
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug
          path: |
            build/attachments
            build/ui.log
          if-no-files-found: ignore
