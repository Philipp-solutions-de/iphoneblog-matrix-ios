name: TestFlight testers

# Run by hand on main. Without inputs it only reads: the groups, their builds and testers, the
# newest builds' internal, external and Beta App Review states, and the team as counts. With an
# email and `team`, it invites that person to the App Store Connect team (Marketing, this app
# only); with an email and a group, it adds them to that TestFlight group (an internal group
# takes only team members who have accepted). Apple mails each invitation.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Tester to add (empty: read only)"
        required: false
        default: ""
      group:
        description: "Exact group name (empty: no group)"
        required: false
        default: ""
      team:
        description: "Invite to the App Store Connect team first (Marketing, this app only)"
        type: boolean
        default: false
      first:
        description: "First name, for a team invitation"
        required: false
        default: ""
      last:
        description: "Last name, for a team invitation"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  testers:
    if: github.ref == 'refs/heads/main'
    environment: apple
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Groups, builds, and the invite
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          INVITE_EMAIL: ${{ inputs.email }}
          INVITE_GROUP: ${{ inputs.group }}
          TEAM_INVITE: ${{ inputs.team }}
          INVITE_FIRST: ${{ inputs.first }}
          INVITE_LAST: ${{ inputs.last }}
        run: |
          # The address stays out of the log.
          if [ -n "$INVITE_EMAIL" ]; then echo "::add-mask::$INVITE_EMAIL"; fi
          bundle exec fastlane ios testers
