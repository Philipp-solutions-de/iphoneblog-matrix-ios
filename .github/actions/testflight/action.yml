name: TestFlight upload
description: >-
  Build the release and upload it to TestFlight with fastlane. The two TestFlight jobs in
  build.yml share these steps; the Apple secrets come in through the calling job's env.
runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: sudo xcode-select -s "$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app | sort -V | tail -1)"
    - name: Install tools (pinned)
      shell: bash
      run: |
        scripts/install-xcodegen.sh build/tools >> "$GITHUB_PATH"
        bundle install
    - name: Vendor/ElementX matches its Element X release plus our patches
      shell: bash
      run: scripts/sync-elementx.sh --check
    - name: Generate the project
      shell: bash
      run: scripts/configure.sh
    - name: Build and upload
      shell: bash
      run: bundle exec fastlane ios beta
