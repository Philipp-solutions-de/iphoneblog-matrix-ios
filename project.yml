# Xcode project, generated by xcodegen through scripts/configure.sh.
# Values in ${...} come from brand.env.
name: iphoneblog

options:
  bundleIdPrefix: ${BUNDLE_ID}
  deploymentTarget:
    # 18.5: the Element X views in ChatKit use iOS 18 APIs. iOS 18 runs on the same iPhones as 17 (XS and later).
    iOS: "18.5"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # The Matrix engine. Pinned to one release; .github/workflows/sdk-bump.yml proposes the next.
  MatrixRustSDK:
    url: https://github.com/element-hq/matrix-rust-components-swift
    exactVersion: 26.11.12

  # ChatKit: Element X's chat views (Vendor/ElementX, AGPL-3.0) and the packages they need.
  # Versions follow Element X's project.yml at the tag in Vendor/ElementX/UPSTREAM.tag.
  Compound:
    path: Vendor/ElementX/compound-ios
  WysiwygComposer:
    url: https://github.com/element-hq/matrix-rich-text-editor-swift
    exactVersion: 2.42.1
  AnalyticsEvents:
    url: https://github.com/matrix-org/matrix-analytics-events
    exactVersion: 0.38.0
  Algorithms:
    url: https://github.com/apple/swift-algorithms
    exactVersion: 1.2.1
  Collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.7.1
  DSWaveformImage:
    url: https://github.com/dmrschmidt/DSWaveformImage
    exactVersion: 14.5.0
  Emojibase:
    url: https://github.com/matrix-org/emojibase-bindings
    revision: 60bc01f2e3b31445dc723f5af1a777b63d18e6c2
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    exactVersion: 8.13.0
  LRUCache:
    url: https://github.com/nicklockwood/LRUCache
    exactVersion: 1.3.0
  Mantis:
    url: https://github.com/guoyingtao/Mantis
    exactVersion: 3.1.0
  SwiftFlow:
    url: https://github.com/tevelee/SwiftUI-Flow.git
    exactVersion: 3.5.1
  SwiftOGG:
    url: https://github.com/element-hq/swift-ogg
    exactVersion: 0.0.4
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.13.9

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Generated
      - path: App/Resources
      # The adapter between the app's Bridge and ChatKit (Vendor/ElementX/Adapter).
      - path: Vendor/ElementX/Adapter
    dependencies:
      # Dynamic: the app, ChatKit and the extension all load it from the app's Frameworks
      # folder. Xcode does not embed it by itself once more than one target links it.
      - package: MatrixRustSDK
        embed: true
      - target: NotificationExtension
        embed: true
      - target: ChatKit
      # ChatKit's voice-message playback links Opus and Ogg as dynamic frameworks; the app embeds them.
      - package: SwiftOGG
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${APP_DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: OAuth callback
            CFBundleURLSchemes: ["${OAUTH_REDIRECT_SCHEME}"]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Damit du Bilder im Chat teilen kannst.
        # Apple refuses an upload whose code reaches the microphone or saves to the photo
        # library without these (ITMS-90683, builds 36 and 40): ChatKit records voice messages
        # and saves images.
        NSMicrophoneUsageDescription: Damit du Sprachnachrichten aufnehmen kannst.
        NSPhotoLibraryAddUsageDescription: Damit du Bilder aus dem Chat in deinen Fotos sichern kannst.
        # The + menu in a conversation offers the camera.
        NSCameraUsageDescription: Damit du Fotos direkt im Chat aufnehmen kannst.
        UIBackgroundModes: [remote-notification]
        # Read by SharedStorage to name the keychain group the extension shares.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        # Keys the Element X views in ChatKit read from the app's Info.plist (InfoPlistReader);
        # a missing one stops the app ("Add <key> into your target's Info.plist").
        baseBundleIdentifier: ${BUNDLE_ID}
        appGroupIdentifier: ${APP_GROUP_ID}
        keychainAccessGroupIdentifier: $(AppIdentifierPrefix)${BUNDLE_ID}
        productionAppName: ${APP_DISPLAY_NAME}
        isNightlyBuild: "NO"
        # Mentions in the composer are text attachments of this exported type.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ${BUNDLE_ID}.pills
            UTTypeDescription: Mention Pills
            UTTypeConformsTo: [public.text]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mention Pills
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: ["${BUNDLE_ID}.pills"]
        LSSupportsOpeningDocumentsInPlace: false
    entitlements:
      path: App/App.entitlements
      properties:
        # TestFlight and the App Store use Apple's production push service.
        aps-environment: production
        keychain-access-groups:
          - $(AppIdentifierPrefix)${BUNDLE_ID}
        com.apple.security.application-groups:
          - ${APP_GROUP_ID}
    settings:
      base:
        PRODUCT_NAME: iphoneblog
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        CODE_SIGN_STYLE: Automatic

  NotificationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationExtension
      - path: App/Generated
      - path: App/Sources/Matrix/MatrixClientFactory.swift
      - path: App/Sources/Matrix/SessionStore.swift
      - path: App/Sources/Matrix/SharedStorage.swift
    dependencies:
      - package: MatrixRustSDK
    info:
      path: NotificationExtension/Info.plist
      properties:
        CFBundleDisplayName: ${APP_DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationExtension/NotificationExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)${BUNDLE_ID}
        com.apple.security.application-groups:
          - ${APP_GROUP_ID}
    settings:
      base:
        PRODUCT_NAME: NotificationExtension
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.nse
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  # Element X's timeline, thread, composer and media views behind a small public API
  # (Vendor/ElementX/Shim/ChatKit.swift). Swift 6 with MainActor default isolation, as upstream.
  ChatKit:
    type: framework
    platform: iOS
    sources:
      - path: Vendor/ElementX/ElementX/Sources
      - path: Vendor/ElementX/Shim
      - path: Vendor/ElementX/ElementX/Resources
    dependencies:
      - package: MatrixRustSDK
      - package: Compound
      - package: WysiwygComposer
      - package: AnalyticsEvents
      - package: Algorithms
      - package: Collections
        product: OrderedCollections
      - package: DSWaveformImage
        product: DSWaveformImageViews
      - package: DSWaveformImage
        product: DSWaveformImage
      - package: Emojibase
      - package: Kingfisher
      - package: LRUCache
      - package: Mantis
      - package: SwiftFlow
        product: Flow
      - package: SwiftOGG
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_NAME: ChatKit
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.chatkit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        OTHER_SWIFT_FLAGS: ["-DIS_MAIN_APP"]
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/AppTests]
    dependencies:
      - target: App
      - package: MatrixRustSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iphoneblog.app/iphoneblog
        BUNDLE_LOADER: $(TEST_HOST)

  IntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/IntegrationTests]
    dependencies:
      - target: App
      - package: MatrixRustSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.integrationtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iphoneblog.app/iphoneblog
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ChatKit:
    build:
      targets:
        ChatKit: all
  iphoneblog:
    build:
      targets:
        App: all
    test:
      targets: [AppTests]
      gatherCoverageData: false
  Integration:
    build:
      targets:
        App: all
    test:
      targets: [IntegrationTests]
