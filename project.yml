# Xcode project, generated by xcodegen through scripts/configure.sh.
# Values in ${...} come from brand.env.
name: iphoneblog

options:
  bundleIdPrefix: ${BUNDLE_ID}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # The Matrix engine. Pinned to one release; .github/workflows/sdk-bump.yml proposes the next.
  MatrixRustSDK:
    url: https://github.com/element-hq/matrix-rust-components-swift
    exactVersion: 26.11.12

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Generated
      - path: App/Resources
    dependencies:
      - package: MatrixRustSDK
      - target: NotificationExtension
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${APP_DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: OAuth callback
            CFBundleURLSchemes: ["${OAUTH_REDIRECT_SCHEME}"]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Damit du Bilder im Chat teilen kannst.
        UIBackgroundModes: [remote-notification]
        # Read by SharedStorage to name the keychain group the extension shares.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        # Keys the Element X views in ChatKit read from the app's Info.plist (InfoPlistReader);
        # a missing one stops the app ("Add <key> into your target's Info.plist").
        baseBundleIdentifier: ${BUNDLE_ID}
        appGroupIdentifier: ${APP_GROUP_ID}
        keychainAccessGroupIdentifier: $(AppIdentifierPrefix)${BUNDLE_ID}
        productionAppName: ${APP_DISPLAY_NAME}
        isNightlyBuild: "NO"
        # Mentions in the composer are text attachments of this exported type.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ${BUNDLE_ID}.pills
            UTTypeDescription: Mention Pills
            UTTypeConformsTo: [public.text]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mention Pills
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: ["${BUNDLE_ID}.pills"]
        LSSupportsOpeningDocumentsInPlace: false
    entitlements:
      path: App/App.entitlements
      properties:
        # TestFlight and the App Store use Apple's production push service.
        aps-environment: production
        keychain-access-groups:
          - $(AppIdentifierPrefix)${BUNDLE_ID}
        com.apple.security.application-groups:
          - ${APP_GROUP_ID}
    settings:
      base:
        PRODUCT_NAME: iphoneblog
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        CODE_SIGN_STYLE: Automatic

  NotificationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationExtension
      - path: App/Generated
      - path: App/Sources/Matrix/MatrixClientFactory.swift
      - path: App/Sources/Matrix/SessionStore.swift
      - path: App/Sources/Matrix/SharedStorage.swift
    dependencies:
      - package: MatrixRustSDK
    info:
      path: NotificationExtension/Info.plist
      properties:
        CFBundleDisplayName: ${APP_DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationExtension/NotificationExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)${BUNDLE_ID}
        com.apple.security.application-groups:
          - ${APP_GROUP_ID}
    settings:
      base:
        PRODUCT_NAME: NotificationExtension
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.nse
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/AppTests]
    dependencies:
      - target: App
      - package: MatrixRustSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iphoneblog.app/iphoneblog
        BUNDLE_LOADER: $(TEST_HOST)

  IntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/IntegrationTests]
    dependencies:
      - target: App
      - package: MatrixRustSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.integrationtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iphoneblog.app/iphoneblog
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  iphoneblog:
    build:
      targets:
        App: all
    test:
      targets: [AppTests]
      gatherCoverageData: false
  Integration:
    build:
      targets:
        App: all
    test:
      targets: [IntegrationTests]
